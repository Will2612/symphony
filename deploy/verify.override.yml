# Override for smoke-test verification (temporary container).
# Usage: docker compose -f deploy/docker-compose.yml -f deploy/verify.override.yml up --build --abort-on-container-exit
# The container_name avoids collision with the running symphony-py.service container.
services:
  symphony:
    container_name: symphony-verify
    restart: "no"
    env_file: []
    environment:
      GITHUB_TOKEN: smoke-stub
      OPENCODE_API_KEY: smoke-stub
    volumes:
      - ./verify.workflow.md:/etc/symphony/WORKFLOW.md:ro
