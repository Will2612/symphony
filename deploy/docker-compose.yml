# docker-compose.yml for Symphony on a single host.
# Use:  docker compose pull && docker compose up -d
# Override image tag or service args by editing the service definition below.

services:
  symphony:
    image: ghcr.io/will2612/symphony:python_implementation_trial@sha256:REPLACEME
    container_name: symphony
    init: true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    env_file:
      - /etc/symphony/symphony.env
    volumes:
      - /etc/symphony/WORKFLOW.md:/etc/symphony/WORKFLOW.md:ro
      # host source: read from deploy/.env; see install.sh for auto-detection
      - ${OPENCODE_BIND_SOURCE}:/usr/local/bin/opencode:ro
      - symphony-workspaces:/var/lib/symphony/workspaces
    command:
      - /etc/symphony/WORKFLOW.md
      - --i-understand-that-this-will-be-running-without-the-usual-guardrails
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
          pids: 512
        reservations:
          memory: 512M
    # Uncomment to expose the observability HTTP server.
    # ports:
    #   - "127.0.0.1:7842:7842"
    # /tmp as tmpfs (image runs as non-root; only /tmp needs scratch).
    tmpfs: [/tmp:size=1g]

volumes:
  symphony-workspaces:
    name: symphony-workspaces