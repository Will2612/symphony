# docker-compose.yml for Symphony on a single host.
# Use:  docker compose pull && docker compose up -d
# Override image tag or service args by editing the service definition below.
#
# This file uses two variables that must be set in the environment
# (or in deploy/.env, which Docker Compose auto-loads):
#   CONFIG_DIR           — host directory containing symphony.env + WORKFLOW.md
#                          (default install location: ~/.config/symphony)
#   OPENCODE_BIND_SOURCE — host path to the opencode binary, bind-mounted
#                          into the container. install.sh auto-detects and
#                          writes this to deploy/.env.
#
# Both variables must be ABSOLUTE paths — neither systemd nor docker
# compose expand a leading `~`. install.sh resolves any `~/...` defaults
# to the user's $HOME before writing them to deploy/.env.

services:
  symphony:
    image: ghcr.io/will2612/symphony:python_implementation_trial
    container_name: symphony
    init: true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    env_file:
      - ${CONFIG_DIR}/symphony.env
    volumes:
      - ${CONFIG_DIR}/WORKFLOW.md:/etc/symphony/WORKFLOW.md:ro
      # host source: read from deploy/.env; see install.sh for auto-detection
      - ${OPENCODE_BIND_SOURCE}:/usr/local/bin/opencode:ro
      - symphony-workspaces:/var/lib/symphony/workspaces
    command:
      - /etc/symphony/WORKFLOW.md
      - --i-understand-that-this-will-be-running-without-the-usual-guardrails
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
          pids: 512
        reservations:
          memory: 512M
    # Uncomment to expose the observability HTTP server.
    # ports:
    #   - "127.0.0.1:7842:7842"
    # /tmp as tmpfs (image runs as non-root; only /tmp needs scratch).
    tmpfs: [/tmp:size=1g]

volumes:
  symphony-workspaces:
    name: symphony-workspaces
