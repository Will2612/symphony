[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symphony-py"
version = "0.1.0"
description = "Symphony service: a per-issue orchestrator that drives an agent runner against a replaceable issue tracker. Python implementation per SPEC.md."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Symphony Contributors" }]
keywords = ["orchestrator", "agent", "tracker", "github", "opencode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "watchfiles>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-bdd>=7.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML",
]
live = [
    "ghapi>=1.0",
]

[project.scripts]
symphony = "symphony.cli:main"

[project.urls]
Homepage = "https://github.com/anomalyco/symphony"
Documentation = "https://github.com/anomalyco/symphony/blob/main/SPEC.md"
Issues = "https://github.com/anomalyco/symphony/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["symphony*"]

[tool.setuptools.package-data]
symphony = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
asyncio_mode = "auto"
bdd_features_base_dir = "tests/features"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:httpx.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:websockets.*",
    "ignore::DeprecationWarning:uvicorn.*",
]
pythonpath = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["symphony"]
omit = [
    "src/symphony/_version.py",
    "src/symphony/__main__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_explicit = false
disallow_any_generics = true
no_implicit_optional = true
plugins = []
exclude = ["^tests/_fakes/", "^build/", "^dist/"]

[[tool.mypy.overrides]]
module = ["pytest", "pytest_bdd"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["_fakes.*"]
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "ANN",
    "RET",
    "PL",
    "TRY",
    "PIE",
]
ignore = [
    "PLR0913",
    "PLR2004",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "PLR2004", "B011"]
"src/symphony/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["symphony", "_fakes"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
